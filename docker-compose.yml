services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
    networks:
      - coolify
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${PORT:-3000}/api/public/health | grep -q '\"ok\":true' || exit 1",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
